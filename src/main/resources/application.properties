
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/deva_inventory?characterEncoding=UTF-8&serverTimezone=UTC}

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=update
spring.jackson.serialization.fail-on-empty-beans=false

# JWT: set JWT_SECRET (>= 32 bytes) in every non-local environment; if unset a random per-process secret is used.
jwt.secret=${JWT_SECRET:}
jwt.issuer=${JWT_ISSUER:deva-inventory}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:30m}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:24h}

# Comma-separated list of origins allowed to call the API with credentials.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
