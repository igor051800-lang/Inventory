

spring.datasource.url=jdbc:mysql://localhost:3306/deva_inventory?characterEncoding=UTF-8&serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update
